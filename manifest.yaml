# ============================================================
# 交接清单 Manifest 模板
# 黄山派嵌入式产品开发实验课程 · Agent协作开发与评审机制
#
# 用途：Dev Agent（学生侧）按此schema生成提交材料，
#       Eval Agent（教师侧）按此schema解析并评审。
# 使用方法：复制本文件为 submission_<学号或组号>_<里程碑>.yaml，
#          按字段填写；带 <> 的地方替换成实际内容。
# 重要：本文件中除 dev_agent.model / dev_agent.tool 等元信息栏位外，
#      其余内容应尽量由agent在开发过程中自动生成/追加，
#      而不是学生在提交前手写编造——手写内容的可信度视同人工记录，
#      不享有"agent执行留痕"的免核验优先级。
# ============================================================

submission:
  student_id: "2024211469"
  student_name: "殷白玉"
  group_id: "<组别，例如 G3>"
  milestone: "T0 入门训练（收尾中）"
  submitted_at: "<ISO时间戳，例如 2026-11-03T21:40:00+08:00>"

dev_agent:
  tool: "Codex"
  model: "<模型版本，例如 claude-sonnet-5，请据实填写，不要凭记忆猜测>"
  session_log_path: "<完整会话记录文件路径，必须是原始导出，不可编辑>"
  session_log_hash: "<可选：会话记录文件的哈希值，用于防止事后篡改>"

requirements:
  prd_path: "<需求规格说明路径，默认 docs/01-需求规格说明.md>"
  hardware_constraints_ref: "<引用的硬件规格文档，例如黄山派硬件手册链接或本地副本路径>"

design:
  architecture_doc_path: "<方案设计说明路径，默认 docs/02-方案设计说明.md>"
  key_decisions:
    # 每一条关键决策都要写清楚：决策内容 / 考虑过的备选方案 / 选择理由 / 谁做的最终决定
    - decision: "T1 使用 5ms 周期轮询读取 KEY1"
      alternatives_considered: "5ms 轮询或 GPIO 中断；中断响应更直接，但处理较复杂"
      rationale: "训练功能较小，轮询代码简单，便于观察和调试"
      decided_by: "Codex 提供备选；殷白玉明确选择轮询"

code:
  repo_url: "<git仓库地址>"
  commit_range: "<起始commit..结束commit，对应本次里程碑>"

physical_verification:
  # 每一个物理验证节点都要有对应记录，节点类型见配套文档《Agent协作开发与评审机制》第三节表格
  - item: "T0 烧录与 RGB 三色循环"
    required_action: "殷白玉运行烧录脚本，观察三色循环，回传截图和视频"
    executed_at: "2026-10-10T13:37:01+08:00"
    evidence_path: "evidence/T0/README.md"
    agent_conclusion: "烧录工具正常结束；殷白玉观察并确认 RGB 循环通过，串口记录有对应输出。视频由学生确认，Codex 未逐帧检查。时间为烧录日志文件记录的开始时间。尚缺 boot ok 与 Hello world 启动行。"

test_results:
  - test_id: "<测试编号，例如 TC-01>"
    description: "<测试内容简述>"
    expected: "<预期结果>"
    actual: "<实测结果>"
    pass: <true 或 false>
    evidence_path: "<对应的原始数据/截图路径>"

known_issues:
  - "T0 运行日志已采集，首次启动的 boot ok 与 Hello world 尚未取证"
  - "视频保存在本地证据目录，不由 Git 跟踪，交付时需另附文件"
  - "完整原始 AI 会话导出尚未提供，精确模型标识未知"
  - "组长蔡融汉，成员殷白玉、郑瑞杭、吴周锦、赵志浩；组号、其他学号及分工未定"

self_review: |
  编译、烧录、三色运行日志和学生视频已留存。脚本两次报错由学生反馈后修复。
  T0 尚需补启动行、正式提交和进度登记，不标记全部完成。

human_checkpoints:
  # 用于区分"学生自己做的决定"和"agent建议、学生只是同意"
  - decision_point: "T1 选择轮询还是 GPIO 中断"
    student_confirmation: "殷白玉选择每 5 毫秒轮询，便于调试"

