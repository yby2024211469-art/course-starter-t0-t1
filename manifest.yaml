# ============================================================
# 交接清单 Manifest 模板
# 黄山派嵌入式产品开发实验课程 · Agent协作开发与评审机制
#
# 用途：Dev Agent（学生侧）按此schema生成提交材料，
#       Eval Agent（教师侧）按此schema解析并评审。
# 使用方法：复制本文件为 submission_<学号或组号>_<里程碑>.yaml，
#          按字段填写；带 <> 的地方替换成实际内容。
# 重要：本文件中除 dev_agent.model / dev_agent.tool 等元信息栏位外，
#      其余内容应尽量由agent在开发过程中自动生成/追加，
#      而不是学生在提交前手写编造——手写内容的可信度视同人工记录，
#      不享有"agent执行留痕"的免核验优先级。
# ============================================================

submission:
  student_id: "2024211469"
  student_name: "殷白玉"
  group_id: "<组别，例如 G3>"
  milestone: "T0 启动验证已完成，T1 开发中"
  submitted_at: "<ISO时间戳，例如 2026-11-03T21:40:00+08:00>"

dev_agent:
  tool: "Codex"
  model: "<模型版本，例如 claude-sonnet-5，请据实填写，不要凭记忆猜测>"
  session_log_path: "<完整会话记录文件路径，必须是原始导出，不可编辑>"
  session_log_hash: "<可选：会话记录文件的哈希值，用于防止事后篡改>"

requirements:
  prd_path: "docs/01-需求规格说明.md"
  hardware_constraints_ref: "<引用的硬件规格文档，例如黄山派硬件手册链接或本地副本路径>"

design:
  architecture_doc_path: "docs/02-方案设计说明.md"
  key_decisions:
    # 每一条关键决策都要写清楚：决策内容 / 考虑过的备选方案 / 选择理由 / 谁做的最终决定
    - decision: "T1 使用 5ms 周期轮询读取 KEY1"
      alternatives_considered: "5ms 轮询或 GPIO 中断；中断响应更直接，但处理较复杂"
      rationale: "训练功能较小，轮询代码简单，便于观察和调试"
      decided_by: "Codex 提供备选；殷白玉明确选择轮询"

code:
  repo_url: "D:/sifli/projects/course_starter（本地仓库，未配置远程）"
  commit_range: "bc40051..7371872（T0 及 T1 实现；后续实测待追加）"

physical_verification:
  # 每一个物理验证节点都要有对应记录，节点类型见配套文档《Agent协作开发与评审机制》第三节表格
  - item: "T0 烧录与 RGB 三色循环"
    required_action: "殷白玉运行烧录脚本，观察三色循环，回传截图和视频"
    executed_at: "2026-10-10T13:37:01+08:00"
    evidence_path: "evidence/T0/README.md"
    agent_conclusion: "烧录工具正常结束；殷白玉观察并确认 RGB 循环通过，串口记录有对应输出。视频由学生确认，Codex 未逐帧检查。时间为烧录日志文件记录的开始时间。"
  - item: "T0 串口启动日志"
    required_action: "殷白玉运行启动采集脚本，允许一次软件重启并回传结果截图"
    executed_at: "2026-10-10T14:06:20+08:00"
    evidence_path: "evidence/T0/boot_log_20261010_140620.txt"
    agent_conclusion: "原始日志包含 v0.1.0 boot ok、Hello world! 和三色循环；截图与日志一致。时间为日志采集开始时间。"

  - item: "T1 烧录、启动自检和首次10次切换"
    required_action: "殷白玉烧录T1，运行采集脚本，回传串口截图和操作视频"
    executed_at: "2026-10-10T14:17:39+08:00"
    evidence_path: "evidence/T1/README.md"
    agent_conclusion: "烧录脚本正常结束；原始日志显示v0.2.0-t1启动、两项自检PASS、计数1至10连续且颜色顺序正确。视频已收存但Codex无法解码，物理按下次数及灯光一致性待操作人确认。时间为日志采集开始时间。"

  - item: "T1 第二轮20次短按、1次按住及5秒保持"
    required_action: "殷白玉执行按键及保持测试，回传截图和视频，确认物理次数与灯光"
    executed_at: "2026-10-10T14:24:00+08:00"
    evidence_path: "evidence/T1/README.md"
    agent_conclusion: "原始日志计数1至21连续、颜色顺序正确、最终红色；殷白玉确认没有重复和漏响应、完全一致。视频收存但未由Codex解码检查。20次轮次符合预期，按计划追加30次及3分钟运行待执行。时间为采集开始时间。"

  - item: "T1 追加30次采集"
    required_action: "殷白玉执行追加30次，回传日志截图和视频"
    executed_at: "2026-10-10T14:30:15+08:00"
    evidence_path: "evidence/T1/README.md"
    agent_conclusion: "原始日志连续1至30、颜色循环正确、最终红色；本轮实际按下数及灯光一致性待操作人确认，视频未由Codex解码。时间为采集开始时间。"

  - item: "T1 3分钟稳定运行补充验证"
    required_action: "殷白玉运行稳定采集，等待180秒后短按10次，回传截图视频及观察结果"
    executed_at: "2026-10-10T14:36:11+08:00"
    evidence_path: "evidence/T1/README.md"
    agent_conclusion: "原始计时等待180.062秒，随后连续10次颜色循环正确、最终绿色；采集仅一次启动，学生确认完全正常。视频未由Codex解码。时间为采集开始时间。"

test_results:
  - test_id: "T0-BOOT"
    description: "T0 编译、烧录、启动与 RGB 循环"
    expected: "正常启动，打印 boot ok、Hello world!，RGB 红绿蓝循环"
    actual: "原始日志符合预期，殷白玉观察灯光并提供视频确认"
    pass: true
    evidence_path: "evidence/T0/README.md"

  - test_id: "TC-003"
    description: "T1 编译及容量检查"
    expected: "构建成功，ROM/RAM 不超出板型容量"
    actual: "构建返回0；main.bin 297932 B，ROM 323805/8388608 B，RAM 56676/523264 B"
    pass: true
    evidence_path: "evidence/T1/build_log_20261010.txt"

  - test_id: "TC-004"
    description: "T1 板端逻辑自检"
    expected: "按键边沿与颜色循环自检PASS"
    actual: "启动原始日志显示 key_edge=PASS color_cycle=PASS"
    pass: true
    evidence_path: "evidence/T1/key_log_20261010_141739.txt"

  - test_id: "TC-001"
    description: "KEY1 短按颜色顺序"
    expected: "初始红，每次按下按绿蓝红循环"
    actual: "10次与本轮21次日志符合顺序，学生确认次数与灯光完全一致"
    pass: true
    evidence_path: "evidence/T1/README.md"
  - test_id: "TC-102"
    description: "释放后5秒保持颜色与计数"
    expected: "颜色与计数不变"
    actual: "本轮结束计数21、红色；学生确认按所给步骤执行后结果一致，时长为人工确认"
    pass: true
    evidence_path: "evidence/T1/README.md"

  - test_id: "TC-104"
    description: "3分钟运行后10次切换（补充测试）"
    expected: "无异常重启，按键次数与顺序正确"
    actual: "计时等待180.062秒，日志仅一次启动，之后1至10连续并最终绿色，学生确认完全正常"
    pass: true
    evidence_path: "evidence/T1/README.md"

